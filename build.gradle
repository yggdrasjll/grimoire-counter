plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
repositories { mavenCentral() }
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
base { archivesName = 'grimoire-counter' }
jar {
	from('LICENSE.txt')
	manifest { attributes('Implementation-Title': 'Grimoire Counter', 'Implementation-Version': project.version, 'Implementation-Vendor': 'Yggdrasjll', 'Created-By': 'Yggdrasjll', 'Copyright': '(c) 2026 Yggdrasjll. All rights reserved.') }
}
// the author's own check of the counter's rules: gradle runClient -Pselftest
loom { runs { client { if (project.hasProperty("selftest")) { vmArg "-Dgrimoire.counter.selftest=1"; programArgs "--width", "1280", "--height", "760" } } } }
